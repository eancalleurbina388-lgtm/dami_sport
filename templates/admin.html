<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | DAMI SPORT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#080808] text-white min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center border-b border-red-900/50 pb-4 mb-8">
            <div class="flex items-center gap-3">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="h-10 w-auto">
                <h1 class="text-xl sm:text-2xl font-black uppercase text-red-600">Panel Admin</h1>
            </div>
            <a href="/" class="bg-[#1a1a1a] hover:bg-red-600 border border-gray-800 text-xs font-bold px-4 py-2 rounded-xl transition">
                <i class="fa-solid fa-store mr-1"></i> Ir al Catálogo Público
            </a>
        </div>

        <!-- Formulario de Subida -->
        <div class="bg-[#121212] border border-red-950/60 rounded-2xl p-6 shadow-2xl mb-10">
            <h2 class="text-lg font-bold text-white mb-4 border-b border-gray-800 pb-2">
                <i class="fa-solid fa-plus text-red-500 mr-2"></i>Agregar Nuevo Modelo
            </h2>

            <form action="/admin" method="POST" enctype="multipart/form-data" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 font-bold mb-1">Nombre del Modelo:</label>
                    <input type="text" name="nombre" placeholder="Ej: Nike Air Force 1" required class="w-full bg-black border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-red-600">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 font-bold mb-1">Calidad:</label>
                    <select name="calidad" class="w-full bg-black border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-red-600">
                        <option value="100% Original">100% Original</option>
                        <option value="Importado Top Quality">Importado Top Quality</option>
                        <option value="Nacional Premium">Nacional Premium</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 font-bold mb-1">Para (Género):</label>
                    <select name="genero" class="w-full bg-black border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-red-600">
                        <option value="Hombre">Hombre</option>
                        <option value="Mujer">Mujer</option>
                        <option value="Unisex">Unisex</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 font-bold mb-1">Precio (S/):</label>
                    <input type="number" step="0.01" name="precio" placeholder="180.00" required class="w-full bg-black border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-red-600">
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs text-gray-400 font-bold mb-1">Tallas separadas por coma:</label>
                    <input type="text" name="tallas" placeholder="Ej: 38,39,40,41,42" required class="w-full bg-black border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-red-600">
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-xs text-gray-400 font-bold mb-1">Foto del Calzado:</label>
                    <input type="file" name="imagen" accept="image/*" required class="w-full bg-black border border-gray-800 rounded-xl p-3 text-sm text-gray-300 focus:outline-none focus:border-red-600">
                </div>

                <div class="sm:col-span-2 pt-2">
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-500 font-bold py-3.5 px-4 rounded-xl transition text-sm uppercase tracking-wider shadow-lg shadow-red-950">
                        Guardar y Publicar
                    </button>
                </div>
            </form>
        </div>

        <!-- Lista de Productos para Eliminar o Gestionar -->
        <h2 class="text-lg font-bold text-white mb-4">Productos en Catálogo ({{ productos|length }})</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {% for p in productos %}
            <div class="bg-[#121212] border border-gray-800 rounded-xl p-4 flex gap-4 items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="{{ url_for('static', filename=p[6]) }}" class="w-14 h-14 object-cover rounded-lg border border-gray-800">
                    <div>
                        <h3 class="font-bold text-sm text-white">{{ p[1] }}</h3>
                        <p class="text-xs text-red-500 font-semibold">S/ {{ "%.2f"|format(p[4]) }}</p>
                    </div>
                </div>
                <form action="/eliminar/{{ p[0] }}" method="POST">
                    <button type="submit" class="bg-red-950/60 hover:bg-red-600 text-red-400 hover:text-white p-2.5 rounded-lg transition text-xs border border-red-800/50">
                        <i class="fa-solid fa-trash"></i> Eliminar
                    </button>
                </form>
            </div>
            {% else %}
            <p class="text-xs text-gray-500 col-span-full">Aún no hay productos subidos.</p>
            {% endfor %}
        </div>
    </div>

</body>
</html>
